name: Morning Message ☀️

on:
  schedule:
    - cron: '30 21 * * *'   # 06:30 JST every day
  workflow_dispatch:        # 手動実行も可

concurrency:
  group: morning-lock
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Call /morning endpoint
        env:
          URL: ${{ secrets.VERCEL_MORNING_URL }}
        run: |
          for i in 1 2 3; do
            echo "Try $i..."
            response=$(curl -s -w "%{http_code}" -H "Authorization: Bearer $MORNING_SECRET" -X POST "$URL")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n-1)
            echo "HTTP Status Code: $http_code"
            echo "Response Body: $body"
            if [ "$http_code" = "200" ]; then
              echo "Success"; exit 0
            fi
            sleep 10
          done
          echo "All retries failed"; exit 1
